name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'app/agents/**'
      - '../../app/core/llm/llm.py'
      - 'app/schemas/agents/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  test_and_eval:
    runs-on: ubuntu-latest

    services:
      db:
        image: ankane/pgvector:v0.4.2
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: password
          POSTGRES_DB: careerpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          POSTGRES_URL: postgresql+psycopg://careerpilot:password@localhost:5432/careerpilot
          LANGSMITH_TRACING: false
          GOOGLE_API_KEY: fake
          DEEPSEEK_API_KEY: fake
        run: uv run pytest tests/

      - name: Run LangSmith Evaluations
        # Only run evaluations if we have the API key (e.g. for PRs from within the repo)
        if: env.LANGSMITH_API_KEY != ''
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: true
          LANGSMITH_PROJECT: eval
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POSTGRES_URL: postgresql+psycopg://careerpilot:password@localhost:5432/careerpilot
        run: uv run python app/evaluation/run_eval.py

  build:
    runs-on: ubuntu-latest
    needs: test_and_eval
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t careerpilot:test .
