networks:
  careerpilot_network:
    driver: bridge

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: careerpilot-db
    command: postgres -c shared_preload_libraries=pg_textsearch
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: password
      POSTGRES_DB: careerpilot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U careerpilot" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - careerpilot_network

  app:
    build: .
    container_name: careerpilot-app
    environment:
      - DATABASE_URL=postgresql+asyncpg://careerpilot:password@db:5432/careerpilot
      - LANGSMITH_TRACING=true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: uv run alembic upgrade head
    networks:
      - careerpilot_network

  jdl-daemon:
    build: .
    container_name: careerpilot-jdl-daemon
    environment:
      - DATABASE_URL=postgresql+asyncpg://careerpilot:password@db:5432/careerpilot
      - LANGSMITH_TRACING=true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: uv run python -m app.scripts.jdl_daemon
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - careerpilot_network

